<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amaranth:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Developer portfolio - selected software projects, skills, certifications, education, and contact information."
    />
    <meta name="theme-color" content="#e9edf7" />
    <title>Suse Developer Portfolio</title>
    <script>
      (() => {
        const root = document.documentElement;
        let savedTheme = null;

        try {
          savedTheme = localStorage.getItem('aldrin-portfolio-theme');
        } catch {
          // Continue with the system theme when storage is unavailable.
        }

        const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark =
          savedTheme === 'dark' || (savedTheme !== 'light' && prefersDark);
        const themeColor = isDark ? '#0b0c0f' : '#e9edf7';

        root.classList.toggle('dark', isDark);
        root.style.colorScheme = isDark ? 'dark' : 'light';
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', themeColor);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
