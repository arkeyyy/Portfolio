<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amaranth:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Developer portfolio - selected software projects, skills, certifications, education, and contact information."
    />
    <meta name="theme-color" content="#0b0c0f" />
    <script>
      (() => {
        const root = document.documentElement;
        const storageKey = 'aldrin-portfolio-theme';
        let isDarkMode;

        try {
          const savedTheme = window.localStorage.getItem(storageKey);
          isDarkMode = savedTheme === 'dark'
            || (savedTheme !== 'light'
              && window.matchMedia('(prefers-color-scheme: dark)').matches);
        } catch {
          isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
        }

        root.classList.toggle('dark', isDarkMode);
        root.style.colorScheme = isDarkMode ? 'dark' : 'light';
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', isDarkMode ? '#0b0c0f' : '#e9edf7');
      })();
    </script>
    <title>Suse Developer Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
